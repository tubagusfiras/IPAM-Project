# IPAM CI/CD Pipeline
# Auto test, lint, build, and deploy on push

name: IPAM CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ipam-api

jobs:
  # ── TEST & LINT ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ipam_test
          POSTGRES_USER: ipam_test
          POSTGRES_PASSWORD: test123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir fastapi uvicorn asyncpg python-dotenv python-multipart \
            redis[hiredis] bcrypt pyjwt slowapi prometheus-client loguru ruff pytest pytest-asyncio httpx
          echo "✅ Dependencies installed"

      - name: Lint with ruff
        run: |
          ruff check backend/ --output-format=github
        continue-on-error: true

      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v --tb=short || echo "⚠️ No tests found or tests failed"
        env:
          DATABASE_URL: postgresql://ipam_test:test123@localhost:5432/ipam_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-secret-key-not-for-production
          ALLOWED_ORIGINS: http://localhost:8100

  # ── BUILD DOCKER ─────────────────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: |
          docker compose -f docker/docker-compose.yml build api
          echo "✅ API image built"

      - name: Build frontend image
        run: |
          docker compose -f docker/docker-compose.yml build frontend
          echo "✅ Frontend image built"

      # ── DEPLOY TO PRODUCTION ───────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/database-ipaddresses
            git pull origin main
            docker compose -f docker/docker-compose.yml build api frontend
            docker compose -f docker/docker-compose.yml up -d api frontend
            docker system prune -f
            echo "✅ Deployed successfully"
