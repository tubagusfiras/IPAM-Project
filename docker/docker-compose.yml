version: "3.9"

services:

  db:
    image: postgres:16-alpine
    container_name: ipam-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipam -d ipam"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ipam-net

  redis:
    image: redis:7-alpine
    container_name: ipam-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - ipam-net

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ipam-api
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:8101:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ipam-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ipam-frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:8100:80"
    depends_on:
      - api
    networks:
      - ipam-net

volumes:
  pgdata:
    name: ipam-pgdata

networks:
  ipam-net:
    name: ipam-network
    driver: bridge
