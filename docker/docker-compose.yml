version: "3.9"

services:

  db:
    image: postgres:16-alpine
    container_name: ipam-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "0.0.0.0:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipam -d ipam"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ipam-net

  redis:
    image: redis:7-alpine
    container_name: ipam-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "0.0.0.0:6380:6379"
    networks:
      - ipam-net

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ipam-api
    restart: unless-stopped
    dns:
      - 103.10.121.34
      - 103.10.121.35
      - 1.1.1.1
    env_file:
      - ../.env
    ports:
      - "0.0.0.0:8101:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ipam-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ipam-frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:8100:80"
    depends_on:
      - api
    networks:
      - ipam-net

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: ipam-prometheus
    restart: unless-stopped
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "0.0.0.0:9090:9090"
    networks:
      - ipam-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ipam-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_ROOT_URL: http://103.10.120.11:3100
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_X_FRAME_OPTIONS: ""
    volumes:
      - ../monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "0.0.0.0:3100:3000"
    depends_on:
      - prometheus
    networks:
      - ipam-net

volumes:
  pgdata:
    name: ipam-pgdata
  prometheus_data:
    name: ipam-prometheus-data
  grafana_data:
    name: ipam-grafana-data

networks:
  ipam-net:
    name: ipam-network
    driver: bridge
